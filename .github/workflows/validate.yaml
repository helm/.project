name: Validate Project Metadata

on:
  pull_request:
    paths:
      - 'org.yaml'
      - '*/project.yaml'
      - '*/maintainers.yaml'
  push:
    branches: [main]
    paths:
      - 'org.yaml'
      - '*/project.yaml'
      - '*/maintainers.yaml'
  workflow_dispatch:

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-project@85e0bcd298817a6e26e286d6b22615f8c81b4e4b
        # No project_file input: with org.yaml present the action validates every project.

  validate-maintainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-maintainers@85e0bcd298817a6e26e286d6b22615f8c81b4e4b
        with:
          # No maintainers_file input: the action discovers every maintainers file.
          # Disabled until the LFX LLT issue is resolved. Validation is done manually for now.
          verify_maintainers: 'false'
        env:
          LFX_AUTH_TOKEN: ${{ secrets.LFX_AUTH_TOKEN }}
